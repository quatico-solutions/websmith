# Dependency updates for the pnpm workspace and the GitHub Actions workflows.
# See docs/plans/2026-10-01-dependency-updates.md for the decisions behind this configuration.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packages/*"
    schedule:
      interval: "weekly"
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      production:
        dependency-type: "production"
        patterns:
          - "*"
      development:
        dependency-type: "development"
        patterns:
          - "*"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # Vite 8 bundles with rolldown and fails the plugin's e2e suites; the plugin supports ^6.3.0 || ^7.0.0.
      # Lift once a plan adds Vite 8 support.
      - dependency-name: "vite"
        update-types:
          - "version-update:semver-major"
      # Types for Node majors CI does not run (22 and 24); 26 also breaks memfs's Stats in fusion-fs.ts.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "E"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "E"
