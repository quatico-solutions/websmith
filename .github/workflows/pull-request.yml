# This workflow will run the distribution steps using node when a pull request is created or updated
# For more information see: https://docs.github.com/en/actions/using-workflows/about-workflows

name: PR Continuous Integration

on:
    pull_request:
        types: [opened, reopened, synchronize]

jobs:
    dist:
        name: ${{ matrix.name }}
        runs-on: ubuntu-latest
        strategy:
            matrix:
                # 22 is the declared engines floor (>=22.12), 24 the development version
                # typescript 6.0.3 comes from the lockfile; the override cell runs 5.7.3, the floor of the peer range, on Node 24
                include:
                    - name: dist (22)
                      node-version: 22
                      typescript: 6.0.3
                      override: false
                    - name: dist (24)
                      node-version: 24
                      typescript: 6.0.3
                      override: false
                    - name: dist (24, typescript 5.7.3)
                      node-version: 24
                      typescript: 5.7.3
                      override: true
        steps:
            - name: checkout
              uses: actions/checkout@v7

            - name: setup
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
            - uses: pnpm/action-setup@v6
              with:
                  version: 9

            - name: install
              if: ${{ !matrix.override }}
              run: pnpm install --frozen-lockfile

            - name: install with typescript override
              if: ${{ matrix.override }}
              run: |
                  pnpm pkg set pnpm.overrides.typescript=${{ matrix.typescript }}
                  pnpm install --no-frozen-lockfile

            - name: assert typescript version
              id: assert-typescript
              env:
                  EXPECTED: ${{ matrix.typescript }}
              run: |
                  pnpm --version
                  packages=$(pnpm -r ls --depth -1 --json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).length")
                  versions=$(node -p "require('typescript/package.json').version"; pnpm -r --reporter-hide-prefix exec node -p "require('typescript/package.json').version")
                  echo "$versions"
                  found=$(printf '%s\n' "$versions" | grep -c . || true)
                  if ! [ "$packages" -gt 1 ] 2>/dev/null || [ "$found" -ne "$packages" ]; then
                      echo "::error::Expected typescript $EXPECTED in ${packages:-?} packages (root included), found $found versions"
                      exit 1
                  fi
                  wrong=$(printf '%s\n' "$versions" | grep -vxF "$EXPECTED" | sort -u | paste -sd, - || true)
                  if [ -n "$wrong" ]; then
                      echo "::error::Expected typescript $EXPECTED, found $wrong"
                      exit 1
                  fi

            - name: lint
              if: ${{ !cancelled() && steps.assert-typescript.outcome == 'success' }}
              run: pnpm lint

            - name: test
              if: ${{ !cancelled() && steps.assert-typescript.outcome == 'success' }}
              run: pnpm test

            - name: build
              id: build
              if: ${{ !cancelled() && steps.assert-typescript.outcome == 'success' }}
              run: pnpm build

            - name: check packed types
              if: ${{ !cancelled() && !matrix.override && steps.build.outcome == 'success' }}
              env:
                  OTHER_TYPESCRIPT: 5.7.3
              run: |
                  mkdir -p "$RUNNER_TEMP/packed-types/packs"
                  for dir in packages/api packages/core packages/testing; do
                      (cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/packed-types/packs")
                  done
                  cp .github/packed-types/tsconfig.json .github/packed-types/consumer.ts "$RUNNER_TEMP/packed-types"
                  cd "$RUNNER_TEMP/packed-types"
                  npm install --no-audit --no-fund --legacy-peer-deps "typescript@$OTHER_TYPESCRIPT" @types/node@22 ./packs/*.tgz
                  npx tsc -v
                  npx tsc -p .

            - name: E2E tests
              if: ${{ !cancelled() && steps.assert-typescript.outcome == 'success' }}
              run: pnpm test:e2e
